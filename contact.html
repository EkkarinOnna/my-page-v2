<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Ekkarin Onna</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Contact Me</h1>
    </header>

    <main>
        <section class="card">
            <h2>แบบฟอร์มการติดต่อ</h2>
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">ชื่อ-นามสกุล:</label>
                    <input type="text" id="name" name="name" placeholder="กรอกชื่อของคุณ" required>
                </div>
                
                <div class="form-group">
                    <label for="email">อีเมล:</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">หัวข้อ:</label>
                    <input type="text" id="subject" name="subject" placeholder="กรอกหัวข้อข้อความ">
                </div>

                <div class="form-group">
                    <label for="message">ข้อความ:</label>
                    <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความที่ต้องการส่ง..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">ส่งข้อความ</button>
            </form>
        </section>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="btn-back">← กลับสู่หน้าหลัก (index.html)</a>
        </div>
    </main>

    <footer>
        <p>
            <a href="https://github.com/ekkarinonna" target="_blank">My GitHub</a> | 
            <a href="index.html">Home</a>
        </p>
        <p>&copy; 2026 Ekkarin Onna. All rights reserved.</p>
    </footer>

</body>
</html>
